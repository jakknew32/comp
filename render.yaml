# ตั้งค่า Render สำหรับโปรแกรมสร้างสมุดระบายสี
#
# ใช้ Docker เพราะต้องติดตั้ง libraqm เพิ่มเติม
# ซึ่งเป็นแพ็กเกจระดับระบบปกติ pip ติดตั้งไม่ได้
# รายละเอียดของเหตุผลอยู่ใน Dockerfile

services:
  - type: web
    name: coloring-book
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      # ฟีเจอร์ AI ใช้งานได้เลยแม้ไม่ใส่คีย์ เพราะมี Pollinations เป็นตัวสำรอง
      # ทุกค่า AI_* / CF_* / HF_TOKEN อธิบายไว้ที่ README.md
      #
      # ระบบเรียกตามลำดับนี้ เจ้าที่ล้ม (โควตาหมด ล่ม) จะข้ามไปตัวถัดไปเอง
      #   Cloudflare → Pollinations → Gemini → Hugging Face
      # Cloudflare มาก่อนเพราะคุณภาพดีกว่า (FLUX.1-schnell) ไม่มีลายน้ำ
      # แต่ต้องมี CF_API_TOKEN กับ CF_ACCOUNT_ID ถ้ายังไม่มีจะข้ามไปใช้ Pollinations เอง
      # ไม่ต้องใส่ค่าลับลงไฟล์นี้ ต้องใส่ผ่านหน้า Environment ของ Render เท่านั้น

      - key: AI_PROVIDER
        value: cloudflare
      - key: POLLINATIONS_MODEL
        value: turbo
        sync: false
      - key: AI_MODEL
        value: gemini-3.1-flash-image-preview
        sync: false

      # --- ค่าลับต้องใส่ผ่านหน้า Environment ของ Render ไม่ใช่ตรงนี้ ---
      # Cloudflare Workers AI ฟรี 10,000 neurons/วัน (~130 ภาพ) คุณภาพดีที่สุดในกลุ่มฟรี
      # สร้าง token ที่ dash.cloudflare.com/profile/api-tokens แล้วใส่ CF_API_TOKEN + CF_ACCOUNT_ID
      # Gemini มีโควตาฟรีรายวันแต่เสี่ยงถูกจำกัด
      # Hugging Face ฟรีเฉพาะเครดิตรายเดือน ถ้าหมดจะข้ามไปเจ้าถัดไปเอง
