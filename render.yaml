# ตั้งค่า Render สำหรับโปรแกรมสร้างสมุดระบายสี
#
# ใช้ Docker เพราะต้องติดตั้ง libraqm เพิ่มเติม
# ซึ่งเป็นแพ็กเกจระดับระบบปกติ pip ติดตั้งไม่ได้
# รายละเอียดของเหตุผลอยู่ใน Dockerfile

services:
  - type: web
    name: coloring-book
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      # ฟีเจอร์ AI ปิดไว้โดยไม่ต้องใส่คีย์ก็ยังใช้โปรแกรมได้ครบ
      # ถ้าต้องการเปิด ให��ใส่คีย์ของคุณใน Environment ของ Render
      # โครงสร้างของไฟล์นี้อ้างอิงค่าได้ที่ค่า AI_* ใน README.md
      - key: AI_MODEL
        value: gemini-3.1-flash-image-preview
        sync: false
